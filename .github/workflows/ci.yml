name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      # Tests run with the offline hashing embedder: no model download.
      - run: python -m pytest -q
        env:
          EMBEDDING_BACKEND: hash

  # Windows PowerShell 5.1 reads BOM-less scripts as ANSI: a stray non-ASCII
  # character breaks parsing, so parse every script with the real 5.1 parser.
  windows-scripts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem scripts -Filter *.ps1) {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errs) | Out-Null
            if ($errs) { $bad++; Write-Host "FAIL $($f.Name): $($errs[0].Message)" } else { Write-Host "ok   $($f.Name)" }
          }
          exit $bad

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run check:sim
